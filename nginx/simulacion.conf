server {
    listen 80;
    server_name mail.hospital.com;

    root /ruta/al/proyecto/simulacion-phishing/public;
    index index.php;

    access_log off;
    error_log /ruta/al/proyecto/simulacion-phishing/logs/nginx_error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000; # completar con el socket o upstream de PHP-FPM
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ^~ /logs/ {
        deny all;
    }
}
